<div class="auth-container">

  <div class="left-panel">
    <div class="logo">
        <span class="logo-icon">🏢</span>
        <div class="logo-text">
            <h2>Vighnahar Residence</h2>
            <p>Smart Society Management</p>
        </div>
        </div>
    <img src="assets/images/hero3.jpg" alt="society">

    <div class="features">
      <div>🔒 Secure & Safe</div>
      <div>🔔 Stay Updated</div>
      <div>👥 Easy Management</div>
    </div>
  </div>

  <div class="right-panel">

    <div class="form-box">

      <h1>Welcome Back!</h1>
      <p>Login to access your society dashboard.</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">

          <!-- Email -->

          <div class="form-group">

            <label>Email / Mobile Number</label>

            <input
              type="text"
              formControlName="email"
              placeholder="Enter Email or Mobile Number">

          </div>

          <div
            class="error"
            *ngIf="
              loginForm.get('email')?.invalid &&
              loginForm.get('email')?.touched
            ">

            Email or Mobile Number is required

          </div>

          <!-- Password -->

          <div class="form-group">

            <label>Password</label>

            <input
              type="password"
              formControlName="password"
              placeholder="Enter Password">

          </div>

          <div
            class="error"
            *ngIf="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            ">

            Password is required

          </div>

          <!-- Remember -->

          <div class="remember">

            <label>

              <input
                type="checkbox"
                formControlName="remember">

              Remember Me

            </label>

            <a href="#">
              Forgot Password?
            </a>

          </div>

          <button
            type="submit"
            class="login-btn">

            Login

          </button>

        </form>
        <p class="bottom-text">
        Don't have an account?
       <a routerLink="/auth/register">Register Now</a>
      </p>

    </div>

  </div>

</div>
